services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: task_matrix_app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      TZ: Asia/Tokyo
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: task_matrix
      DB_USERNAME: task_user
      DB_PASSWORD: task_password
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: task_matrix_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      TZ: Asia/Tokyo
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: task_matrix_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --default-time-zone='+09:00'
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: task_matrix
      MYSQL_USER: task_user
      MYSQL_PASSWORD: task_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "task_user", "-ptask_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    driver: local
